info:
  contact: {}
  description: |-
    Infrastructure inventory for SEAD-PI: hosts, services, DNS, projects, secrets, Atlas API catalog and integrations.
    Auth: the browser session cookie (POST /api/auth/login), or an API token sent as "Authorization: Bearer brg_…" (Configurações → Tokens de API; personal or for a service account). A token acts as its owner — same role, permissions and entidades — narrowed to its scopes: each operation below names the scope it needs (x-bridge-scope); a token without it gets 403. GET /api/auth/tokens/scopes lists them.
    Roles are viewer < editor < admin; each operation's description states the minimum it needs. Assets scoped by entidades answer 404 (never 403) when invisible to the caller.
    Lists return {data, meta:{page, per_page, total}}; omit per_page to get every row.
  title: Bridge API
  version: "1.0"
paths:
  /api/ai/assist/host-doc:
    post:
      consumes:
      - application/json
      description: Requires permission ai.use. Returns {documentation}. 503 when the
        LLM is not configured.
      parameters:
      - description: Host to document
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.aiAssistHostDocRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Draft host documentation
      tags:
      - ai
  /api/ai/assist/issue:
    post:
      consumes:
      - application/json
      description: Requires permission ai.use. Returns {description}. 503 when the
        LLM is not configured.
      parameters:
      - description: Summary and optional context
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.aiAssistIssueRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Draft an issue description
      tags:
      - ai
  /api/ai/chat:
    post:
      consumes:
      - application/json
      description: Requires permission ai.use. Returns {response}. 503 when the LLM
        is not configured.
      parameters:
      - description: User message
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.aiChatRequest'
      produces:
      - application/json
      responses:
        "200":

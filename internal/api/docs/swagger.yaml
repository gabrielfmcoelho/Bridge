            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Ask about the infrastructure
      tags:
      - ai
  /api/ai/status:
    get:
      description: Any role. Returns {enabled, configured, model}.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: LLM integration status
      tags:
      - ai
  /api/api-catalog:
    get:
      description: Any role. Only APIs visible to the caller (entidade scoping).
      parameters:
      - description: Search text
        in: query
        name: q
        type: string
      - description: Only APIs linked to this service
        in: query
        name: service_id
        type: integer
      - description: Only APIs linked to this project, directly or through its services
        in: query
        name: project_id
        type: integer
      - description: Page (1-based)
        in: query
        name: page
        type: integer
      - description: Page size (max 200); omit for every row
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ListEnvelope-models_APICatalog'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: List catalogued APIs
      tags:
      - atlas
    post:
      consumes:
      - application/json
      description: 'Editor+. For APIs with no OpenAPI spec to import (SOAP, vendors
        that publish none): source_type "manual", no operations; a spec uploaded later
        (POST /{id}/spec) turns it into an upload. name is required; source_url is
        ignored. Linked services/projects must be visible (404 otherwise).'
      parameters:
      - description: Metadata, links and entidade grants
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.importURLRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.APICatalog'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Register an API without an OpenAPI spec
      tags:
      - atlas
  /api/api-catalog/{id}:
    delete:
      description: Admin. Soft delete.
      parameters:
      - description: API catalog ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Delete a catalogued API
      tags:
      - atlas
    get:
      description: Any role; invisible APIs answer 404. Includes its operations, links,
        responsáveis and entidade grants.
      parameters:
      - description: API catalog ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APICatalog'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Get a catalogued API
      tags:
      - atlas
    put:
      consumes:
      - application/json
      description: 'Editor+; invisible APIs answer 404. Partial: an omitted field
        keeps its value (urls/links/responsáveis too); grants change only when a grant
        field is sent.'
      parameters:
      - description: API catalog ID
        in: path
        name: id
        required: true
        type: integer
      - description: Metadata and optional entidade grants
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.updateCatalogRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APICatalog'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Update a catalogued API's metadata
      tags:
      - atlas
  /api/api-catalog/{id}/key-management:
    put:
      consumes:
      - application/json
      description: Admin. key_management none, manual or keycloak; for keycloak the
        API's base URL (its root, where GET /escopos and GET /admin/uso live) and
        its scope prefix (scopes "<prefix>:…", clients "<prefix>-<label>"). The Keycloak
        connection itself is the keycloak_apis integration setting. "bridge" is reserved
        for Bridge's own entry.
      parameters:
      - description: API catalog ID
        in: path
        name: id
        required: true
        type: integer
      - description: Mode, base URL and scope prefix
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.keyManagementRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.APICatalog'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Set an API's key management
      tags:
      - atlas
  /api/api-catalog/{id}/key-management/test:
    post:
      consumes:
      - application/json
      description: 'Admin. With the given (unsaved) base URL and scope prefix, falling
        back to the stored ones: reads the API''s scope catalogue and lists its Keycloak
        clients through the keycloak_apis integration. Always 200: {success, error
        | keys, scopes}.'
      parameters:
      - description: API catalog ID
        in: path
        name: id
        required: true
        type: integer
      - description: Values to try
        in: body
        name: body
        schema:
          $ref: '#/definitions/api.keyManagementRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.keyManagementTestResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Test an API's Keycloak connection
      tags:
      - atlas
  /api/api-catalog/{id}/keys:
    get:
      description: Any role that can see the API (404 otherwise). Metadata only; the
        plaintext is read through the vault and needs apis.keys.manage. Revoked keys
        and passed grace periods are hidden unless include_revoked=true.
      parameters:
      - description: API catalog ID
        in: path
        name: id
        required: true
        type: integer
      - description: Also list revoked keys
        in: query
        name: include_revoked
        type: boolean
      - description: Page (1-based)
        in: query
        name: page
        type: integer
      - description: Page size (max 200); omit for every row
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.ListEnvelope-models_APIKey'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: List an API's access keys
      tags:
      - atlas
    post:
      consumes:
      - application/json
      description: 'apis.keys.manage. In keycloak mode a Keycloak client "<scope_prefix>-<label>"
        is created with the chosen scopes (from GET …/keys/scopes) as optional client
        scopes (every one must carry the API''s "<scope_prefix>:") and the rate limit
        as its rate_limit_per_minute claim; its secret comes back once here. The integration''s
        own client ids are refused. On Bridge''s own entry the client also gets a
        service-account user (the least role its scopes need, never above the caller''s
        role nor, for a token caller, its token''s scopes). In manual mode send the
        existing key as value. Either way the plaintext is also stored in the vault.
        Label: letters, digits, . _ - (max 64), unique among the API''s live keys.'
      parameters:
      - description: API catalog ID
        in: path
        name: id
        required: true
        type: integer
      - description: Key
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.apiKeyCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.apiKeyCreateResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:

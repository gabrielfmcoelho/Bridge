  /api/telemetry/requests:
    get:
      description: 'Any role that can see the asset (404 otherwise). Reads SigNoz:
        an API''s spans come from the APISIX gateway (filtered by the path of its
        base_url), a service''s and a host''s from Coolify''s Traefik (by Coolify
        resource uuid; a host = its services). Optional filters route (normalized,
        as group_by=route reports it), key (Keycloak client; APIs only) and status.
        series_by=key adds one line per top-5 key plus "__outros__" (APIs only). facets
        lists the window''s top routes and keys, ignoring the route/key/status filters.
        Keys are labelled with their Bridge key and owner; host services with their
        nickname. {available:false, reason} when SigNoz isn''t configured or the asset
        has nothing to match on. Latencies in ms; errors = 5xx.'
      parameters:
      - description: Asset kind
        enum:
        - api
        - service
        - host
        in: query
        name: kind
        required: true
        type: string
      - description: API or service id, or host slug
        in: query
        name: id
        required: true
        type: string
      - default: 24h
        description: Window
        enum:
        - 1h
        - 24h
        - 7d
        - 30d
        in: query
        name: range
        type: string
      - default: route
        description: Top groups
        enum:
        - route
        - key
        - status
        - service
        in: query
        name: group_by
        type: string
      - description: Only this normalized route
        in: query
        name: route
        type: string
      - description: Only this Keycloak client (APIs)
        in: query
        name: key
        type: string
      - description: Only this HTTP status
        in: query
        name: status
        type: string
      - description: Extra series per key (APIs)
        enum:
        - key
        in: query
        name: series_by
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.telemetryResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: Request telemetry (count, errors, p50/p95/p99)
      tags:
      - telemetry
  /api/telemetry/spans:
    get:
      description: 'Any role that can see the asset (404 otherwise). The newest gateway
        (APIs) or Traefik (services, hosts) spans in the window, filtered like /api/telemetry/requests
        (route, key, status): time, trace and span ids, method, normalized route,
        path, status, duration and, for APIs, the Keycloak client with its Bridge
        label. Paths never carry the query string. limit 1–100 (default 50).'
      parameters:
      - description: Asset kind
        enum:
        - api
        - service
        - host
        in: query
        name: kind
        required: true
        type: string
      - description: API or service id, or host slug
        in: query
        name: id
        required: true
        type: string
      - default: 24h
        description: Window
        enum:
        - 1h
        - 24h
        - 7d
        - 30d
        in: query
        name: range
        type: string
      - description: Only this normalized route
        in: query
        name: route
        type: string
      - description: Only this Keycloak client (APIs)
        in: query
        name: key
        type: string
      - description: Only this HTTP status
        in: query
        name: status
        type: string
      - default: 50
        description: Rows (1–100)
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":

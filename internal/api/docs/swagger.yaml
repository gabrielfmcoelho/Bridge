        items:
          $ref: '#/definitions/models.Responsavel'
        type: array
      scope_prefix:
        type: string
      service_ids:
        description: |-
          ServiceIDs / ProjectIDs are the direct links (api_service_links,
          api_project_links); always set, [] when none — an API with neither is
          "avulso".
        items:
          type: integer
        type: array
      source_type:
        type: string

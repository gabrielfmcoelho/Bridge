  /api/webhooks/grafana/alerts:
    post:
      consumes:
      - application/json
      description: 'Public, no auth, but HMAC-signed: X-Sshcm-Signature must be the
        HMAC-SHA256 of the raw body with the configured webhook secret ("sha256=<hex>"
        or bare hex). Alerts are upserted by fingerprint and matched to hosts via
        the sshcm_slug, host or instance label. Returns {processed, skipped, unmatched?}.
        Errors are plain text, not JSON.'
      parameters:
      - description: HMAC-SHA256 of the raw body
        in: header
        name: X-Sshcm-Signature
        required: true
        type: string
      - description: Grafana Unified Alerting contact-point payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.grafanaWebhookPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Unreadable body or invalid JSON
          schema:
            type: string
        "401":
          description: Signature mismatch
          schema:
            type: string
        "500":
          description: Server misconfigured
          schema:
            type: string
        "503":
          description: Webhook secret not configured
          schema:
            type: string
      summary: Grafana alert webhook
      tags:
      - grafana

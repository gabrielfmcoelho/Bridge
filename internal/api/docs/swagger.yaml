  /api/telemetry/traces/{trace_id}:
    get:
      description: Any role that can see the asset (kind/id), and only when the trace
        holds a span of that asset in the last 30 days — 404 otherwise, so a trace
        id alone opens nothing. Every span of the trace, any service (gateway, the
        API's own spans, its downstream calls), ordered by start, with offsets and
        durations in ms. Authorization and cookie attributes are dropped for everyone.
        Query values (url.query, http.target, http.url, url.full) are shown to admins
        only; others get the parameter names. At most 500 spans (cut:true beyond).
      parameters:
      - description: Trace id (32 hex)
        in: path
        name: trace_id
        required: true
        type: string
      - description: Asset kind
        enum:
        - api
        - service
        - host
        in: query
        name: kind
        required: true
        type: string
      - description: API or service id, or host slug
        in: query
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.telemetryTraceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/httpx.ErrorResponse'
      summary: One request's whole trace
      tags:
      - telemetry

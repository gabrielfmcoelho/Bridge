name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    # Postgres-only. Tests spin ephemeral Postgres containers via
    # testcontainers-go (internal/dbtest + internal/pgtest), using the Docker
    # daemon present on GitHub-hosted runners — no service container needed.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -buildvcs=false ./...

  frontend-check:
    name: Frontend type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
